<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Vault // Database & File Storage</title>
    <!-- Include Supabase JS SDK via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 { margin-bottom: 20px; font-size: 1.5rem; color: #38bdf8; }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #94a3b8; }
        textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #0f111a;
            border: 1px solid #334155;
            color: white;
            border-radius: 4px;
            font-family: inherit;
        }
        textarea { resize: vertical; height: 80px; }
        .btn {
            background: #38bdf8;
            color: #0f111a;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            transition: 0.2s;
        }
        .btn:hover { background: #0ea5e9; }
        .vault-item {
            background: #0f111a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            word-break: break-all;
        }
        .vault-item p { margin-bottom: 8px; font-size: 0.95rem; }
        .vault-item a { color: #38bdf8; font-size: 0.85rem; text-decoration: none; }
        .vault-item a:hover { text-decoration: underline; }
        .status { margin-top: 10px; font-size: 0.85rem; color: #34d399; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>// CLOUD STORAGE VAULT</h1>
        
        <!-- Upload Card -->
        <div class="card">
            <div class="form-group">
                <label>Text Note / Entry</label>
                <textarea id="noteInput" placeholder="Type text to save to database..."></textarea>
            </div>
            <div class="form-group">
                <label>File Upload (Image, PDF, Document)</label>
                <input type="file" id="fileInput">
            </div>
            <button class="btn" onclick="saveToVault()">Upload to Database & Storage</button>
            <div class="status" id="statusMessage"></div>
        </div>

        <!-- Retrieved Database Entries Card -->
        <div class="card">
            <h1>Vault Entries</h1>
            <div id="vaultList">Loading entries from database...</div>
        </div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE PROJECT CREDENTIALS (from supabase.com)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function saveToVault() {
            const noteText = document.getElementById('noteInput').value.trim();
            const fileInput = document.getElementById('fileInput').files[0];
            const statusEl = document.getElementById('statusMessage');

            if (!noteText && !fileInput) {
                alert("Please add at least a note or select a file.");
                return;
            }

            statusEl.innerText = "Processing upload...";
            let fileUrl = null;

            try {
                // 1. If a file was selected, upload it to Supabase Storage bucket named 'vault-files'
                if (fileInput) {
                    const fileName = `${Date.now()}_${fileInput.name}`;
                    const { data: fileData, error: fileError } = await supabase.storage
                        .from('vault-files')
                        .upload(fileName, fileInput);

                    if (fileError) throw fileError;

                    // Get the public URL of the uploaded file
                    const { data: publicUrlData } = supabase.storage
                        .from('vault-files')
                        .getPublicUrl(fileData.path);
                    
                    fileUrl = publicUrlData.publicUrl;
                }

                // 2. Save text note and file URL together in a Supabase database table named 'vault_entries'
                const { error: dbError } = await supabase
                    .from('vault_entries')
                    .insert([{ note: noteText, file_url: fileUrl }]);

                if (dbError) throw dbError;

                statusEl.innerText = "Success! Saved to database & storage.";
                document.getElementById('noteInput').value = '';
                document.getElementById('fileInput').value = '';
                loadVaultEntries();

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Error: " + err.message;
            }
        }

        async function loadVaultEntries() {
            const listEl = document.getElementById('vaultList');
            
            // Query data from the 'vault_entries' table ordered by newest first
            const { data, error } = await supabase
                .from('vault_entries')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                listEl.innerHTML = "Error loading entries (Check database table setup).";
                return;
            }

            if (data.length === 0) {
                listEl.innerHTML = "Vault is empty.";
                return;
            }

            listEl.innerHTML = "";
            data.forEach(item => {
                let div = document.createElement('div');
                div.className = 'vault-item';
                div.innerHTML = `<p>${item.note || '<i>No text note</i>'}</p>`;
                if (item.file_url) {
                    div.innerHTML += `<a href="${item.file_url}" target="_blank">🔗 View Attached File</a>`;
                }
                listEl.appendChild(div);
            });
        }

        // Load entries when page opens
        loadVaultEntries();
    </script>
</body>
</html>
